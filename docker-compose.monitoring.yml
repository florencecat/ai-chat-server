# Мониторинг: Prometheus, Grafana, Loki, Alloy, node-exporter, cAdvisor.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Все сервисы в сети хоста и слушают только 127.0.0.1: так Prometheus видит
# ai-server (127.0.0.1:9091), PocketBase и Caddy, которые живут вне Docker,
# а наружу не открыто ничего. Доступ — через SSH-туннель:
#
#   ssh -N -L 3000:127.0.0.1:3000 user@server   →   http://localhost:3000
#
# Переменные (из .env рядом): GRAFANA_ADMIN_PASSWORD, PB_DATA_DIR.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --listen_ip=127.0.0.1
      - --port=8088
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      # Посекундные и потоковые метрики на одном сервере не нужны, а рядов дают много.
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    logging: *logging

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    network_mode: host
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *logging

  alloy:
    image: grafana/alloy:v1.8.0
    container_name: alloy
    restart: unless-stopped
    network_mode: host
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # access-лог Caddy (deploy/caddy). Нет каталога — Alloy просто его не найдёт.
      - /var/log/caddy:/var/log/caddy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    logging: *logging

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Источник данных SQLite — для журнала запросов PocketBase.
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      # pb_data PocketBase: Grafana читает из него только auxiliary.db (_logs).
      - ${PB_DATA_DIR:?set PB_DATA_DIR in .env}:/pb_data:ro
    depends_on:
      - prometheus
      - loki
    logging: *logging

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
