# Маркеры, при которых ответ не может быть спокойнее уровня vet_24h.
#
# Проверка односторонняя: сервер сверяет текст ответа модели с этим списком и
# ПОДНИМАЕТ urgency, если модель занизила уровень. Понижать автоматически
# нельзя ни при каких условиях — цена ошибки несимметрична.
#
# Совпадение ищется как подстрока в нижнем регистре, поэтому пишите корень
# слова без окончания: «судорог» поймает и «судороги», и «судорогами».
markers:
  # Дыхание и сознание
  - не дышит
  - задыхает
  - одышк
  - синий язык
  - синюшн
  - потеря сознания
  - без сознания
  - обморок
  - судорог
  - припадок
  # Кровь
  - кровотечен
  - кровь в моче
  - кровь в кале
  - кровавая рвота
  - рвота с кровью
  - кал с кровью
  # Отравления и инородные тела
  - отравлен
  - проглотил
  - инородное тело
  - изюм
  - шоколад
  - антифриз
  - крысиный яд
  - ксилит
  # Острые состояния
  - заворот желудка
  - вздутие живота
  - не может помочиться
  - не мочится
  - непрекращающаяся рвота
  - многократная рвота
  - температура выше 40
  - переохлажден
  - тепловой удар
  - укус змеи
  - травма головы
  - сбила машина
  - упал с высоты
  - роды больше
  - не может разродиться
