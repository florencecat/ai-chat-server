# Prometheus живёт в сети хоста, поэтому все цели — на 127.0.0.1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ai-server
    static_configs:
      - targets: ["127.0.0.1:9091"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:8088"]

  # Метрики Caddy: нужен глобальный параметр `metrics` в Caddyfile
  # (см. deploy/caddy/Caddyfile.example). Admin API слушает localhost:2019.
  - job_name: caddy
    static_configs:
      - targets: ["127.0.0.1:2019"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]
