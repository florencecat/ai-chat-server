apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100

  # Журнал запросов PocketBase (v0.23+): таблица _logs в pb_data/auxiliary.db.
  # Хранится столько дней, сколько задано в админке PocketBase
  # (Settings → Logs → Max days retention).
  - name: PocketBase logs
    uid: pocketbase
    type: frser-sqlite-datasource
    jsonData:
      path: /pb_data/auxiliary.db
      # Только чтение: Grafana не должна ничего писать в базу PocketBase.
      pathOptions: "?mode=ro"
