[DEFAULT]
# Свои адреса, которые нельзя банить ни при каких условиях (через пробел).
ignoreip = 127.0.0.1/8 ::1
# Повторные баны удлиняются: 1ч → 2ч → 4ч … до недели.
bantime.increment = true
bantime.maxtime = 1w

# Одно обращение к /.env, *.php и т.п. — бан.
[caddy-probe]
enabled  = true
port     = http,https
filter   = caddy-probe
logpath  = /var/log/caddy/access.log
backend  = auto
maxretry = 1
findtime = 1h
bantime  = 1d

# 20 ответов 404 за 5 минут — бан.
[caddy-404]
enabled  = true
port     = http,https
filter   = caddy-404
logpath  = /var/log/caddy/access.log
backend  = auto
maxretry = 20
findtime = 5m
bantime  = 1h
