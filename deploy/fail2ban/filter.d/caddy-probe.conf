# Запросы, которые делают только сканеры уязвимостей: .env, .git, *.php,
# wp-*, phpinfo и т.п. У ai-server таких путей нет, поэтому одного
# попадания достаточно для бана.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"[^"]*(?i:/\.(?!well-known/)|\.php\b|/wp-|phpinfo|/_profiler|/_environment|/server-status|/cgi-bin/)
ignoreregex =
datepattern = "ts":{EPOCH}
