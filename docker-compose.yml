services:
  ai-server:
    image: ghcr.io/${GITHUB_REPOSITORY:-florencecat/ai-chat-server}:latest
    container_name: ai-server
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри контейнера слушаем все интерфейсы, наружу порт опубликован
      # только на loopback хоста — его забирает Prometheus.
      METRICS_ADDR: ":9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:9091:9091"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
